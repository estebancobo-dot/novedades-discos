- id: wikipedia
  nombre: Wikipedia – List of albums
  web: https://en.wikipedia.org/wiki/List_of_2026_albums
  familia: todas
  rol: listado
  mixta: true
  lector: texto
  fecha_es: lanzamiento
  anio_desde_url: 'List_of_(\d{4})_albums'
  urls:
    - "https://en.wikipedia.org/wiki/List_of_2026_albums_(July%E2%80%93December)"
    - "https://en.wikipedia.org/wiki/List_of_2026_albums_(January%E2%80%93June)"
    - "https://en.wikipedia.org/wiki/List_of_2027_albums_(January%E2%80%93June)"
  texto:
    selector: .mw-parser-output
    marcas: {"i": "«»"}
    quitar: "sup.reference, .reflist, .navbox, .mw-editsection"
