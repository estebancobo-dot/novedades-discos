# Fuentes de datos. Para añadir una web nueva basta con añadir una entrada.
#
# Campos:
#   id, nombre, web       identificación
#   familia               country | hardrock   (las familias están en taxonomia.yaml)
#   rol                   listado (anuncia lanzamientos) | resena | noticia | sello
#   lector                texto | rss | sonda
#   urls                  páginas a leer
#   paginacion            {plantilla: "...{n}...", desde: 2, hasta: 5}
#   fecha_es              lanzamiento | publicacion | alta   (qué significa la fecha)
#   mixta                 true si la fuente mezcla otros géneros (metal, pop…):
#                         sus discos solo entran si se les reconoce un subgénero
#   texto                 cómo convertir el HTML: selector, marcas, enlaces, imagenes,
#                         desde, hasta, quitar
#   cabecera_fecha        regex: línea que fija la fecha de los items siguientes
#   patrones              lista de regex con grupos con nombre:
#                         artista, titulo, fecha, sello, genero, tipo, nota, url, portada, extra
#   filtro / excluir      regex que el texto debe cumplir / no cumplir
#   nota                  regex para la nota de una reseña (en el contenido)
#   detalle               abrir la página de cada item: {texto, campos, contar, patrones, max, solo_si}
#
# Marcas que añade el conversor:  «…» (lo que digan las marcas, p. ej. cursivas),
# ⟦url⟧ delante del texto de un enlace, ⟪src⟫ en lugar de una imagen, " | " entre celdas.

# ---- Macros: trozos de regex reutilizables. En un patrón se escriben {{NOMBRE}} ----
macros:
  MES: '(?:January|February|March|April|May|June|July|August|September|October|November|December)'
  # Título entre comillas (curvas, rectas, simples o dobles); admite apóstrofos dentro.
  T: '(?:“(?P<titulo>[^”\n]+)”|‘(?P<titulo_2>(?:[^’\n]|’(?=[a-zA-Z]))+)’|"(?P<titulo_3>[^"\n]+)"|''(?P<titulo_4>(?:[^''\n]|''(?=[a-zA-Z]))+)'')'
  ART: '(?P<artista>[^:“"‘\n]+?)'
  VERBO: '(?:announces?|unveils?|reveals?|readies|confirms?|details?|shares?|releases?|drops?|launch(?:es)?|unleash(?:es)?|premieres?|debuts?|returns?\s+with|previews?|streams?|sets?|plots?|teases?)'

# ---- Patrones compartidos (se reutilizan con *nombre) ----
patrones_noticias: &noticias
  # "X announces new album “Y”", "X Readies New Album “Y”", "X Announces Release Date for New Album, ‘Y’"
  - '(?i)^{{ART}}\s+{{VERBO}}\b[^“"‘\n]*?\b(?:album|LP|record|full-length)\b[,:]?\s*{{T}}'
  # "X Announces ‘Y’ New Album"
  - '(?i)^{{ART}}\s+{{VERBO}}\s+{{T}}\s*(?:new\s+|debut\s+|studio\s+)*(?:album|LP|record)\b'
  # "X share video for … from upcoming album ‘Y’"
  - '(?i)^{{ART}}\s+(?:share|unveil|drop|release|launch|unleash|premiere|debut|reveal|stream|issue|celebrate)s?\b.*?\bfrom\s+(?:the\s+|their\s+|his\s+|her\s+)?(?:upcoming|forthcoming|new|debut|latest|next)\s+(?:\w+\s+)?(?:album|record|LP)\s+{{T}}'
  # Notas de prensa en mayúsculas: "SAXON RETURN WITH 25TH STUDIO ALBUM GODS OF THUNDER ARRIVING JANUARY 22"
  - '(?i)^{{ART}}\s+(?:announce|return\s+with|release|reveal|unveil)s?\s+(?:their\s+|new\s+|\d+(?:st|nd|rd|th)\s+)*(?:studio\s+|live\s+|debut\s+)?album\s+[“"‘]?\s*(?P<titulo>[^”"’\n]+?)\s*[”"’]?\s+(?:arriving|out|due|available|coming|released?)\b'

nota_10: &nota_10 '(?P<nota>\b\d{1,2}(?:\.\d)?\s?/\s?10\b)'

fuentes:

# ============================================================ COUNTRY / AMERICANA / FOLK
- id: scm_radar
  nombre: Saving Country Music – Release Radar
  web: https://savingcountrymusic.com
  familia: country
  rol: listado
  lector: texto
  fecha_es: lanzamiento
  anio_desde_publicacion: true      # las fechas no traen año: se toma el de la página
  urls:
    - https://savingcountrymusic.com/release-radar-most-anticipated-new-country-albums-for-2026/
    - https://savingcountrymusic.com/release-radar-most-anticipated-new-albums-for-2nd-half-of-2026/
    - https://savingcountrymusic.com/release-radar-most-anticipated-new-albums-for-final-portion-of-2026/
  texto:
    selector: article
    marcas: {"em, i": "«»", "strong, b": ["**", "**"]}
    desde: "OTHER ANTICIPATED/CONFIRMED RELEASES"
    hasta: "THE RUMOR MILL"
  cabecera_fecha: '^\*\*\s*(?P<fecha>{{MES}}\s+\d{1,2}(?:st|nd|rd|th)?(?:,?\s+\d{4})?)\s*\*\*'
  patrones:
    - '^(?:\((?P<fecha>\d{1,2}-\d{1,2})\)\s*)?(?P<artista>[^«\n*]+?)\s*[–-]\s*«(?P<titulo>[^»]+)»\s*(?P<tipo>EP\b)?\s*(?:\((?P<fecha_2>\d{1,2}-\d{1,2})\)|\((?P<genero>[^)\n]+)\))?[^\n]*$'

