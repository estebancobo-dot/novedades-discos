# Todos los requisitos (131) con su capa y las comprobaciones automáticas que los verifican.
# Lo lee scraper/validar.py en cada ejecución. comprobaciones:
#   nombre        → función de scraper/validar.py (sobre los datos, la configuración o el repositorio)
#   web:NOMBRE    → comprobación de la prueba en navegador (tests/e2e/web.mjs) con ese nombre
