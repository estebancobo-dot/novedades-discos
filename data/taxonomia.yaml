# Taxonomía cerrada. Un disco puede tener varios subgéneros.
# - alias: variantes de escritura de las etiquetas de origen (MusicBrainz, Bandcamp,
#   prensa…). Se comparan sin mayúsculas, acentos ni signos.
# - frontera: true → se etiqueta, pero no es el foco: un disco que solo tenga
#   subgéneros frontera y venga solo de fuentes "mixtas" no entra en la web.
# - Los subgéneros nuevos NUNCA se crean solos: se proponen en docs/informe.md.
#
# Para añadir una familia o un subgénero basta con editar este archivo.

reglas:
  max_subgeneros: 4
  # Un disco es "Destacado" con nota media >= este valor o con 3 reseñas o más.
  destacado_nota: 8.0
  # Etiquetas de MusicBrainz que se miran (están ordenadas por votos).
  max_etiquetas_musicbrainz: 8
  # En descripciones de texto libre solo se buscan alias de 2+ palabras o con guion,
  # para evitar falsos positivos ("western Pennsylvania").
  alias_en_texto_min_palabras: 2

familias:

  country:
    nombre: Country / Americana / Folk
    nombre_corto: Country · Americana · Folk
    # Indican la familia pero no un subgénero concreto.
    genericas: [country, country music, country and western, country & western, c&w, nashville]
    grupos:
      Country:
        traditional-country:
          nombre: Traditional country
          descripcion: "Country clásico de violín y steel guitar, y su revival neotradicional de los 80-90."
          alias: [traditional country, classic country, neotraditional, neotraditional country, neo-traditional country, neo traditional country, old-school country, real country, traditional country music]
        honky-tonk:
          nombre: Honky-tonk
          descripcion: "Country de bar y baile: ritmo marcado, steel guitar y letras de desamor y alcohol."
          alias: [honky tonk, honky-tonk, honkytonk, honky tonk country]
        outlaw-country:
          nombre: Outlaw country
          descripcion: "El country rebelde de los 70 (Waylon, Willie) y sus herederos: crudo y fuera de Nashville."
          alias: [outlaw country, outlaw, outlaw music]
        bakersfield:
          nombre: Bakersfield
          descripcion: "Country eléctrico y seco de California (Buck Owens, Merle Haggard): Telecaster y twang."
          alias: [bakersfield, bakersfield sound]
        western-swing:
          nombre: Western swing
          descripcion: "Country bailable con swing y jazz de Texas y Oklahoma (Bob Wills)."
          alias: [western swing]
        texas-red-dirt:
          nombre: Texas / Red Dirt
          descripcion: "Country de Texas y Oklahoma, entre el honky-tonk y el rock, con escena propia."
          alias: [texas country, red dirt, red dirt country, texas red dirt, red dirt music, texas music]
        country-pop:
          nombre: Country pop
          descripcion: "El country de las radios: producción pop y estribillos grandes."
          alias: [country pop, country-pop, pop country, contemporary country, mainstream country, modern country, bro-country, bro country, nashville pop, new country]
        country-rock:
          nombre: Country rock
          descripcion: "Country con batería y guitarras eléctricas del rock (Eagles, Poco)."
          alias: [country rock, country-rock, southern country rock]
        cosmic-country:
          nombre: Cosmic country
          descripcion: "Country con psicodelia y ambición progresiva (Gram Parsons, Sturgill Simpson)."
          alias: [cosmic country, progressive country, cosmic american music, psychedelic country, psych country]
        western:
