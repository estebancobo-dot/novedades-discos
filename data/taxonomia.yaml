# Taxonomía cerrada. Un disco puede tener varios subgéneros.
# - alias: variantes de escritura de las etiquetas de origen (MusicBrainz, Bandcamp,
#   prensa…). Se comparan sin mayúsculas, acentos ni signos.
# - frontera: true → se etiqueta, pero no es el foco: un disco que solo tenga
#   subgéneros frontera y venga solo de fuentes "mixtas" no entra en la web.
# - Los subgéneros nuevos NUNCA se crean solos: se proponen en docs/informe.md.
#
# Para añadir una familia o un subgénero basta con editar este archivo.

reglas:
  max_subgeneros: 4
  # Etiquetas de MusicBrainz que se miran (están ordenadas por votos).
  max_etiquetas_musicbrainz: 8
  # En descripciones de texto libre solo se buscan alias de 2+ palabras o con guion,
  # para evitar falsos positivos ("western Pennsylvania").
  alias_en_texto_min_palabras: 2

familias:

  country:
    nombre: Country / Americana / Folk
    nombre_corto: Country · Americana · Folk
    # Indican la familia pero no un subgénero concreto.
    genericas: [country, country music, country and western, country & western, c&w, nashville]
    grupos:
      Country:
        traditional-country:
          nombre: Traditional country
          alias: [traditional country, classic country, neotraditional, neotraditional country, neo-traditional country, neo traditional country, old-school country, real country, traditional country music]
        honky-tonk:
          nombre: Honky-tonk
          alias: [honky tonk, honky-tonk, honkytonk, honky tonk country]
        outlaw-country:
          nombre: Outlaw country
          alias: [outlaw country, outlaw, outlaw music]
        bakersfield:
          nombre: Bakersfield
          alias: [bakersfield, bakersfield sound]
        western-swing:
          nombre: Western swing
          alias: [western swing]
        texas-red-dirt:
          nombre: Texas / Red Dirt
          alias: [texas country, red dirt, red dirt country, texas red dirt, red dirt music, texas music]
        country-pop:
          nombre: Country pop
          alias: [country pop, country-pop, pop country, contemporary country, mainstream country, modern country, bro-country, bro country, nashville pop, new country]
        country-rock:
          nombre: Country rock
          alias: [country rock, country-rock, southern country rock]
        cosmic-country:
          nombre: Cosmic country
          alias: [cosmic country, progressive country, cosmic american music, psychedelic country, psych country]
        western:
          nombre: Western
          alias: [western, cowboy, cowboy songs, cowboy music, western music, cowboy western]
      Americana:
        americana:
          nombre: Americana
          alias: [americana, roots, roots music, american roots, american roots music, roots americana]
        alt-country:
          nombre: Alt-country
          alias: [alt-country, alt country, alternative country, insurgent country, altcountry]
        roots-rock:
          nombre: Roots rock
          alias: [roots rock, roots-rock, american roots rock]
        southern-gothic:
          nombre: Southern gothic
          alias: [southern gothic, gothic americana, gothic country, dark americana, dark country]
        country-soul:
          nombre: Country soul
          alias: [country soul, country-soul]
        cowpunk:
          nombre: Cowpunk
          alias: [cowpunk, cow punk, country punk, punk country]
      Bluegrass y old-time:
        bluegrass:
          nombre: Bluegrass
          alias: [bluegrass, traditional bluegrass, bluegrass music]
        newgrass:
          nombre: Newgrass
          alias: [newgrass, progressive bluegrass, jamgrass, new grass]
        old-time:
          nombre: Old-time
          alias: [old-time, old time, oldtime, old-time music, string band, appalachian, appalachian music, clawhammer, old time music]
      Folk:
        singer-songwriter:
          nombre: Singer-songwriter
          alias: [singer-songwriter, singer songwriter, singer/songwriter, songwriter]
        contemporary-folk:
          nombre: Contemporary folk
          alias: [contemporary folk, folk, modern folk, folk music, acoustic folk, american folk]
        indie-folk:
          nombre: Indie folk
          alias: [indie folk, indie-folk, folk indie]
        folk-rock:
          nombre: Folk rock
          alias: [folk rock, folk-rock, electric folk]
        traditional-folk:
          nombre: Traditional folk
          alias: [traditional folk, trad folk, british folk, english folk, celtic folk, irish folk, scottish folk, appalachian folk, celtic, folk traditional]
        psych-folk:
          nombre: Psych folk
          alias: [psych folk, psych-folk, psychedelic folk, freak folk, acid folk, freak-folk]
        folk-pop:
          nombre: Folk pop
          alias: [folk pop, folk-pop, indie folk pop]
      Fronteras:
        country-blues:
          nombre: Country blues
          frontera: true
          alias: [country blues, acoustic blues, delta blues, piedmont blues]
        southern-gospel:
          nombre: Southern gospel
          frontera: true
          alias: [southern gospel, country gospel, bluegrass gospel]
        heartland-rock:
          nombre: Heartland rock
          frontera: true
          alias: [heartland rock, heartland]

  hardrock:
    nombre: Hard rock / AOR
    nombre_corto: Hard rock · AOR
    genericas: [hard rock, hard-rock, hardrock, rock, classic rock, heavy rock]
    grupos:
      AOR y melodic:
        aor:
          nombre: AOR
          alias: [aor, adult oriented rock, album oriented rock, melodic rock / aor, melodic rock aor]
        melodic-rock:
          nombre: Melodic rock
          alias: [melodic rock, melodic rock / aor, melodic rock aor]
        westcoast:
          nombre: Westcoast
          alias: [westcoast, west coast, west coast aor, pop aor, pop aor / westcoast, yacht rock]
        arena-rock:
          nombre: Arena rock
          alias: [arena rock, stadium rock]
        melodic-hard-rock:
          nombre: Melodic hard rock
          alias: [melodic hard rock, scandinavian melodic rock, swedish melodic rock, scandinavian hard rock, swedish hard rock]
      Hard rock:
