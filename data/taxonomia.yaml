          descripcion: "Country alternativo nacido del punk y el indie (Uncle Tupelo, Whiskeytown)."
          alias: [alt-country, alt country, alternative country, insurgent country, altcountry]
        roots-rock:
          nombre: Roots rock
          descripcion: "Rock de raíces: directo, terrenal, cercano al country y al blues."
          alias: [roots rock, roots-rock, american roots rock]
        southern-gothic:
          nombre: Southern gothic
          descripcion: "Americana oscura de historias sureñas sombrías y atmósfera inquietante."
          alias: [southern gothic, gothic americana, gothic country, dark americana, dark country]
        country-soul:
          nombre: Country soul
          descripcion: "El encuentro del country y el soul sureño (Muscle Shoals, Memphis)."
          alias: [country soul, country-soul]
        cowpunk:
          nombre: Cowpunk
          descripcion: "Country tocado con la energía y la actitud del punk."
          alias: [cowpunk, cow punk, country punk, punk country]
      Bluegrass y old-time:
