# Etiquetas que no dicen nada de género (lugares, décadas, formatos…). No se
# consultan al LLM ni cuentan como "sin encajar".
ignorar: [usa, us, uk, american, british, canadian, australian, english, scottish, irish, swedish, norwegian, finnish, german, italian, nashville tennessee, texas usa, male vocalists, female vocalists, female vocals, male vocals, vocal, vocals, live, album, albums, music, new, 2020s, 2026, 2025, 2027, guitar, acoustic, instrumental, band, cover, covers, christmas, holiday, vinyl, cd, cassette, digital, debut, ep, lp, seen live, favorites, favourite, a]
