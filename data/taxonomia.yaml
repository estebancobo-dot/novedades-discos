          alias: [80s hard rock, 1980s hard rock, 80s rock, 80s hard rock / heavy metal]
        glam-sleaze:
          nombre: Glam / sleaze
          alias: [glam metal, hair metal, sleaze rock, sleaze, sleaze glam, sleaze metal, pop metal, glam sleaze, hair rock]
        blues-rock:
          nombre: Blues rock
          alias: [blues rock, blues-rock, hard blues, heavy blues, southern or blues rock, blues rock / hard rock]
        southern-rock:
          nombre: Southern rock
          alias: [southern rock, southern or blues rock, southern hard rock]
        modern-hard-rock:
          nombre: Modern hard rock
          alias: [modern hard rock, post-grunge, post grunge, active rock, modern rock, hard rock modern]
        retro-rock:
          nombre: Retro rock
          alias: [retro rock, new wave of classic rock, nwocr, classic rock revival, 70s rock revival, rock revival]
        stoner-rock:
          nombre: Stoner rock
          alias: [stoner rock, stoner, desert rock, fuzz rock, stoner metal]
      Prog:
        prog-rock:
          nombre: Prog rock
          alias: [progressive rock, prog rock, prog, prog-rock, symphonic prog, symphonic rock, art rock]
        prog-aor:
          nombre: Prog AOR / neo-prog
          alias: [melodic prog, neo-prog, neo prog, neo-progressive, neo-progressive rock, prog aor, progressive aor, crossover prog]
      Fronteras:
        melodic-metal:
          nombre: Melodic metal
          frontera: true
          alias: [melodic metal, melodic heavy metal]
        power-metal:
