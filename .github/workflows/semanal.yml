name: Actualización semanal

on:
  schedule:
    - cron: "23 5 * * 6"        # sábados a las 05:23 UTC
  workflow_dispatch:             # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]
    paths: ["site/**"]           # republicar la web si cambia su código

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: semanal
  cancel-in-progress: false

jobs:
  datos:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recoger novedades (solo las últimas semanas; lo anterior se conserva)
        run: python -m scraper.recoger --incremental
      - name: Etiquetas extra (Wikidata, Discogs, Last.fm) para los discos sin subgénero
        run: python -m scraper.enriquecer
        env:
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
      - name: Clasificar con la taxonomía
        run: python -m scraper.clasificar
      - name: Informe
        run: python -m scraper.informe
      - name: Datos de la web
        run: python -m scraper.web
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs site/data
          git diff --cached --quiet || git commit -m "Datos: actualización semanal $(date -u +%F)"
          git push

  publicar:
    needs: datos
    if: always() && (needs.datos.result == 'success' || needs.datos.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # la versión recién guardada por el paso anterior
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
