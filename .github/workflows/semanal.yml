name: Actualización de datos y web

# Todo el proceso corre en GitHub, sin depender de ninguna sesión ni gastar tokens:
#   - sábados: recogida semanal (incremental) y publicación;
#   - cada día: si la última ejecución se cortó (límite de tiempo, error de red), se reanuda
#     por la fase pendiente; si no hay nada a medias, no hace nada;
#   - a mano (pestaña Actions → Run workflow): incremental o completa.
# Tras cada fase se guardan los datos en el repositorio, así que nada de lo hecho se pierde.

on:
  schedule:
    - cron: "23 5 * * 6"        # sábados 05:23 UTC: recogida semanal
    - cron: "47 4 * * *"        # cada día 04:47 UTC: reanudar si quedó algo a medias
  workflow_dispatch:
    inputs:
      modo:
        description: "incremental (últimas semanas) o completa (toda la ventana)"
        type: choice
        options: [incremental, completa]
        default: incremental
  push:
    branches: [main]
    paths: ["site/**"]           # republicar la web si cambia su código

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  datos:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 340          # el máximo de GitHub son 360; lo pendiente sigue al día siguiente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recuperar páginas y lecturas guardadas de la ejecución anterior
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache/http
            data/cache/lecturas
          key: lecturas-${{ github.run_id }}
          restore-keys: lecturas-
      - name: Fases (recoger → enriquecer → clasificar → mapear → informe → web)
        env:
          LASTFM_KEY: ${{ secrets.LASTFM_KEY }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          URL_WEB: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          EVENTO: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          MODO: ${{ inputs.modo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$EVENTO" = "schedule" ] && [ "$CRON" = "47 4 * * *" ]; then
            python -m scraper.pipeline --solo-reanudar --git
          elif [ "$MODO" = "completa" ]; then
            python -m scraper.pipeline --git
          else
            python -m scraper.pipeline --incremental --git
          fi
      # ---- Etiquetas que Wikidata no resolvió: Claude Code con el plan Pro (sin API de pago) ----
      # Solo si existe el secreto CLAUDE_CODE_OAUTH_TOKEN (se genera con `claude setup-token`) y
      # quedan etiquetas pendientes. Claude solo lee la lista y escribe un JSON de respuestas; el
      # código las valida contra la taxonomía antes de aplicarlas.
      - name: ¿Hay etiquetas pendientes para Claude?
        id: pendientes
        if: github.event.schedule != '47 4 * * *'     # solo en la semanal o a mano, no en la reanudación diaria
        env:
          TOKEN_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN_CLAUDE" ]; then
            echo "Sin CLAUDE_CODE_OAUTH_TOKEN: las etiquetas quedan con Wikidata." ; echo "n=0" >> "$GITHUB_OUTPUT" ; exit 0
          fi
          python -m scraper.etiquetas_llm exportar --max=300
          n=$(python -c "import json;print(len(json.load(open('data/etiquetas_pendientes.json'))))")
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - name: Claude (plan Pro) clasifica las etiquetas pendientes
        if: steps.pendientes.outputs.n != '' && steps.pendientes.outputs.n != '0'
        continue-on-error: true            # si falla o se agota el límite del plan, se deja para otra semana
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 8
            --allowedTools "Read,Write"
          prompt: |
            Read data/taxonomia.yaml (the subgenre ids are the keys under familias → grupos) and
            data/etiquetas_pendientes.json (music tags with how often they appear and an example disc).
            For every tag, decide which subgenre ids of the taxonomy it names (0 to 3, most specific first).
            Use "ninguno" for anything that is not a style in the taxonomy: places, people, bands, labels,
            moods, themes, instruments, decades, formats, or genres the taxonomy does not have.
            If a tag is a real rock/pop/folk/country/blues genre missing from the taxonomy, answer
            "ninguno" with the note "propuesta: <genre name>". Never invent ids.
            Write only the file data/respuestas_llm.json with this exact shape and nothing else:
            {"<tag exactly as given>": ["id-one|id-two" or "ninguno", "optional short note"], ...}
            Do not modify any other file.
      - name: Aplicar respuestas y volver a clasificar, informe y web
        if: steps.pendientes.outputs.n != '' && steps.pendientes.outputs.n != '0'
        env:
          URL_WEB: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python -m scraper.etiquetas_llm aplicar
          python -m scraper.pipeline --desde=clasificar_2 --git
      - name: Guardar páginas y lecturas para la próxima ejecución
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache/http
            data/cache/lecturas
          key: lecturas-${{ github.run_id }}
      - name: Resumen (fases y estado de cada fuente)
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          if os.path.exists("data/estado_pipeline.json"):
              p = json.load(open("data/estado_pipeline.json"))
              print(f"### Ejecución {p.get('modo')} del {p.get('inicio')} — {'terminada' if p.get('terminada') else 'a medias'}\n")
              print("| Fase | Estado | Segundos |\n|---|---|---:|")
              for k, v in p.get("fases", {}).items():
                  print(f"| {k} | {v.get('estado')} | {v.get('segundos', '')} |")
          if os.path.exists("data/estado_fuentes.json"):
              e = json.load(open("data/estado_fuentes.json"))
              malas = {k: v for k, v in e.get("fuentes", {}).items() if v["estado"] != "ok"}
              print(f"\n### Fuentes: {len(e.get('fuentes', {})) - len(malas)} bien, {len(malas)} con problemas\n")
              if malas:
                  print("| Fuente | Estado | Detalle |\n|---|---|---|")
                  for k, v in malas.items():
                      print(f"| {v['nombre']} | {v['estado']} | {v.get('detalle', '')[:120]} |")
          PY

  publicar:
    needs: datos
    if: always() && (needs.datos.result == 'success' || needs.datos.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # la versión recién guardada por el paso anterior
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
